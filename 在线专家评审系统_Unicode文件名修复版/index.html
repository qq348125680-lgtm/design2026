<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>专家在线评审系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="landing">
  <div class="hero">
    <div class="tag">免费部署 · 无需购买服务器</div>
    <h1>专家在线评审系统</h1>
    <p>承办方批量上传 ZIP，系统自动解压并在线展示；专家扫码后直接看作品、评分，不需要下载压缩包。</p>
    <div class="actions">
      <a class="btn primary" href="judge.html">专家评审入口</a>
      <a class="btn" href="admin.html">承办方管理后台</a>
    </div>
  </div>
  <div class="cards">
    <div class="card"><b>批量上传</b><span>一次选择多个 ZIP，自动编号 A01、A02……</span></div>

    <div class="card"><b>成绩汇总</b><span>后台自动统计平均分、已评人数并可导出 CSV</span></div>
  </div>
</div>
